# Port Configuration
server.port=9090

# Database Configuration (Persistent H2 File in user home)
spring.datasource.url=jdbc:h2:file:~/sweet_shop_tracker;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console Configuration (available at http://localhost:9090/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# File Upload sizes (optional, but good practice)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
