# Port Configuration (Render automatically sets PORT environment variable, which Spring Boot picks up)
server.port=${PORT:8080}

# Database Configuration (Using standard Render PostgreSQL variables)
spring.datasource.url=jdbc:postgresql://dpg-d87imebtqb8s739b825g-a:5432/sweetshop_q5j9
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA and Hibernate configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false

# ===== CONNECTION POOL SETTINGS =====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ===== LOGGING CONFIGURATION =====
logging.level.root=WARN
logging.level.com.sweetshop.tracker=INFO
